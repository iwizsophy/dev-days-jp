name: Build workshop distribution

on:
  workflow_dispatch:
  pull_request:
    paths: ['content/ja/**', 'content/_images/**', 'scripts/**', '.github/workflows/distribution.yml']
  push:
    branches: [main, feature/app-based-materials, feature/pdf-distribution]
    paths: ['content/ja/**', 'content/_images/**', 'scripts/**', '.github/workflows/distribution.yml']

permissions:
  contents: read

jobs:
  pdf:
    if: github.repository == 'iwizsophy/dev-days-jp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF build dependencies
        run: |
          python -m pip install -r scripts/requirements-pdf.txt
          npm ci --prefix scripts/pdf --ignore-scripts
          node scripts/pdf/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Test and build from Markdown
        run: |
          python scripts/test_distribution.py
          python scripts/build_distribution.py
      - name: Render visual review pages
        run: |
          python scripts/render_pdf_review.py output/pdf/dev-days-app-participant.pdf
          python scripts/render_pdf_review.py output/pdf/dev-days-app-instructor.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-pdf
          path: output/pdf/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-pdf-visual-review
          path: tmp/pdfs/review/
          retention-days: 7
